name: Extract Aldos RPG v120

on:
  push:
    branches:
      - chatgpt-extract-v120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted/references
          unzip -q AldosRPG_v120_MOBILE_COMPACT_FIX_FULL.zip -d extracted/project
          find . -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -exec cp -v {} extracted/references/ \;
          find extracted -maxdepth 3 -type f | sort | head -200

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: aldos-v120-extracted
          path: extracted
          compression-level: 0
          retention-days: 1
